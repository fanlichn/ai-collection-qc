<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录质检后台</title>
    <link rel="stylesheet" href="/static/style.css?v=call-volume">
    <style>
        .login-panel {max-width:420px;margin:10vh auto}
        .login-panel form {display:grid;gap:16px;margin:0}
        .login-panel label,.login-panel input {display:block;width:100%}
        .login-panel input {margin-top:5px}
        .login-panel [role="alert"] {color:#991b1b}
    </style>
</head>
<body>
<main>
    <section class="panel login-panel">
        <h1>登录质检后台</h1>
        <!-- LOGIN_ERROR -->
        <form method="post" action="/login">
            <label>账号 <input name="username" autocomplete="username" maxlength="256" required></label>
            <label>密码 <input type="password" name="password" autocomplete="current-password" maxlength="1024" required></label>
            <button type="submit">登录</button>
        </form>
    </section>
</main>
</body>
</html>
