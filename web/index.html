<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 智能催收质检</title><link rel="stylesheet" href="/static/style.css?v=recording-pagination"></head><body><header><div><h1>AI 智能催收质检平台</h1></div><a href="/api/export.csv">导出 CSV</a></header><main><section class="cards"><article><span>录音总数</span><strong id="total">-</strong></article><article><span>已完成质检</span><strong id="completed">-</strong></article><article><span>待处理</span><strong id="pending">-</strong></article><article><span>失败任务</span><strong id="failed">-</strong></article><article><span>平均得分</span><strong id="avg">-</strong></article><article><span>待复核/高风险</span><strong id="review">-</strong></article></section><section class="panel"><div class="panel-title"><h2>通话录音</h2><button onclick="load()">刷新</button></div>
<p id="recordingChartFilter" class="muted" role="status"></p>
<form id="recordingSearch" role="search" class="recording-search">
    <input id="recordingKeyword" type="search" aria-label="搜索录音" placeholder="文件名、设备 ID 或转录关键词" maxlength="200">
    <button type="submit">搜索</button>
    <button type="reset">清空</button>
</form>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>文件</th><th>设备</th><th>语言</th><th>状态</th><th>评分</th><th>风险</th><th>时间</th><th>详情</th></tr></thead><tbody id="rows"><tr><td colspan="9">加载中…</td></tr></tbody></table></div>
<nav class="recording-pagination" aria-label="录音分页">
    <button type="button" id="recordingPrevious" disabled>上一页</button>
    <span id="recordingPageStatus" class="muted" role="status"></span>
    <button type="button" id="recordingNext" disabled>下一页</button>
</nav>
</section><section class="panel"><h2>员工与设备绑定</h2><form id="emp"><input name="employee_code" placeholder="员工编号" required><input name="name" placeholder="员工姓名" required><input name="team" placeholder="团队"><input name="device_id" placeholder="APK deviceId"><button>添加员工</button></form><div id="employees"></div></section><section class="panel" aria-labelledby="callVolumeTitle">
    <h2 id="callVolumeTitle">员工通话量</h2>
    <form id="callVolumeForm" class="call-volume-form">
        <label>统计方式 <select id="callVolumePeriod"><option value="day">按天</option><option value="month">按月</option></select></label>
        <label id="callVolumeDayLabel">日期 <input id="callVolumeDay" type="date" required></label>
        <label id="callVolumeMonthLabel" hidden>月份 <input id="callVolumeMonth" type="month" required disabled></label>
        <button type="submit">查询</button>
    </form>
    <p class="muted">每条已采集录音计 1 通。按文件或目录日期统计，缺失时用 OSS 修改时间或入库日期（北京时间）。员工归属按当前设备绑定。</p>
    <p id="callVolumeStatus" role="status"></p>
    <div id="callVolumeResults"></div>
    <div id="callVolumeCharts" class="volume-charts"></div>
</section></main><dialog id="detail"><div class="dialog-head"><h2>录音质检详情</h2><button onclick="document.querySelector('#detail').close()">关闭</button></div><div id="detailBody"></div></dialog><script src="/static/app.js?v=call-outcome"></script></body></html>
